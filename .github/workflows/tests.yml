# Runs the overlay's tests on every push and pull request: on Windows (the real thing, with
# the exact packages the downloads are built with) and on macOS (running from source). Pull
# requests from other people's copies of the repo get a read-only token and no secrets
# (GitHub's rule for pull_request), so their code can't change anything here.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Logic tests
        run: python tests/test_logic.py
      - name: Screen-reading tests
        run: python tests/test_screen.py
      - name: Health report tests
        run: python tests/test_health.py
      - name: Reader v2 shared pieces tests
        run: python tests/test_v2.py
      - name: Build plan and Mac test build tests
        run: python tests/test_release.py
      - name: Map-name matching tests (the site's)
        run: node server/test_mapnames.mjs
      - name: Old-address redirect test (the site's)
        run: node server/test_redirect.mjs
      - name: Health summary script tests (the owner's)
        run: node server/test_health_summary.mjs
      - name: Bug report tests
        run: python tests/test_report.py
      - name: Text-reading tests (Tesseract, when installed)
        run: python tests/test_ocr.py
      - name: Window tests (the notes box, in the real window)
        run: python tests/test_ui.py
      - name: Site tests (a local copy of the site on this machine, a fresh database for each)
        run: |
          npm ci --prefix server
          python server/run_tests.py

  macos:
    # The overlay can run from source on a Mac (the game in CrossOver, Whisky, Parallels or a
    # stream). There's no Mac download, so this only needs to prove the code works there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Tesseract and the packages
        run: |
          brew install tesseract
          python -m pip install -r requirements.txt
      - name: Logic tests
        run: python tests/test_logic.py
      - name: Screen-reading tests
        run: python tests/test_screen.py
      - name: Health report tests
        run: python tests/test_health.py
      - name: Reader v2 shared pieces tests
        run: python tests/test_v2.py
      - name: Build plan and Mac test build tests
        run: python tests/test_release.py
      - name: Map-name matching tests (the site's)
        run: node server/test_mapnames.mjs
      - name: Old-address redirect test (the site's)
        run: node server/test_redirect.mjs
      - name: Health summary script tests (the owner's)
        run: node server/test_health_summary.mjs
      - name: Bug report tests
        run: python tests/test_report.py
      - name: Text-reading tests (Tesseract, when installed)
        run: python tests/test_ocr.py
      - name: Window tests (the notes box, in the real window)
        run: python tests/test_ui.py

  linux:
    # The overlay can also run from source on Linux (the game through Steam/Proton, Lutris or Wine).
    # There's no Linux download, so this only needs to prove the code works there. Xvfb gives the
    # window code a real X server to talk to (there's no game, so only its "not found" ways run).
    # test_ui isn't run here: some of its checks expect text to fit a box to the pixel, and X11's own
    # text measuring doesn't quite match the other OSes' (the layout copes by itself, e.g. it shows a
    # shorter label rather than a clipped one).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Tesseract, Xvfb and the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr xvfb
          python -m pip install -r requirements.txt
      - name: Logic tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_logic.py
      - name: Screen-reading tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_screen.py
      - name: Health report tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_health.py
      - name: Reader v2 shared pieces tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_v2.py
      - name: Bug report tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_report.py
      - name: Text-reading tests (Tesseract, when installed)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_ocr.py

